# ตัวดึงข้อมูลหลักของ production: GitHub Actions ทุก 10 นาที → ดึง 5 แหล่ง (Node ทำงานหนัก) → PUT bundle เต็มเข้า Worker
# เหตุผล: cron ใน Cloudflare Worker (free plan) ถูกฆ่าด้วยลิมิต CPU 10 ms ตอน parse JSON หลาย MB ของ สสน./Traffy (ตรวจ 27 ก.ย. 2569)
# Secrets ที่ต้องตั้ง (Settings → Secrets and variables → Actions): WORKER_URL, INGEST_TOKEN, GISTDA_API_KEY
# หมายเหตุ: schedule ของ GitHub อาจล่าช้าได้หลายนาทีช่วงโหลดสูง; repo public รันได้ไม่จำกัดนาที (private: 2,000 นาที/เดือน — ทุก 10 นาที × ~1 นาที = ~4,300 นาที/เดือน จึงควรเป็น public หรือปรับเป็น */15)
name: ingest
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: ingest
  cancel-in-progress: true
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ingest.ts --push
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          GISTDA_API_KEY: ${{ secrets.GISTDA_API_KEY }}
