# ทางเลือกแทน cron ใน Worker: ดึงข้อมูลบน GitHub Actions แล้ว push เข้า Worker (PUT /api/ingest)
# ใช้เมื่อ Worker free plan ติดลิมิต CPU 10 ms/ครั้ง (payload ของ สสน. + Traffy รวมกัน ~10 MB)
# ต้องตั้ง secrets: WORKER_URL, INGEST_TOKEN  (Settings → Secrets and variables → Actions)
# หมายเหตุ: GitHub schedule ช้าสุด ~5 นาที และอาจล่าช้าช่วงโหลดสูง; repo public รันได้ไม่จำกัดนาที
name: ingest
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: ingest
  cancel-in-progress: true
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ingest.ts --push
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
