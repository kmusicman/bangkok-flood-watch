name = "flood-watch"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# ปิดโฮสต์ *.workers.dev — ใช้โดเมนจริงอย่างเดียว (static assets ตอบก่อน Worker จึง redirect ในโค้ดไม่ได้)
workers_dev = false

# โดเมนจริง (zone bangkokflood.com อยู่ในบัญชีเดียวกัน) — wrangler สร้าง DNS + ใบรับรองให้เอง
# www เสิร์ฟหน้าเว็บเหมือน apex; ถ้าต้องการ redirect www → apex ให้ตั้ง Redirect Rule ใน dashboard ของ zone (ฟรี)
routes = [
  { pattern = "bangkokflood.com", custom_domain = true },
  { pattern = "www.bangkokflood.com", custom_domain = true },
]

# Worker เดียวเสิร์ฟทั้งหน้าเว็บ (static assets จาก nuxt generate) และ API — origin เดียวกัน ไม่ต้องตั้ง CORS
# build หน้าเว็บก่อน deploy: `npm run build:web` ที่ root (หรือ `npm run deploy` ทำให้ทั้งคู่)
[assets]
directory = "../web/.output/public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/health"]

# Cron ทุก 10 นาที = สะกิด GitHub Actions เท่านั้น (Worker ไม่ดึง/ไม่ parse ข้อมูลเอง — ลิมิต CPU 10 ms ของ free plan)
[triggers]
crons = ["*/10 * * * *"]

[[kv_namespaces]]
binding = "FLOOD_DATA"
id = "d061225e70414035ae1b97020ee896d8"

[vars]
# origin อื่นที่อนุญาตให้เรียก API (คั่นด้วย ,) — หน้าเว็บอยู่ origin เดียวกับ API อยู่แล้ว ใส่เผื่อ dev เท่านั้น
ALLOWED_ORIGIN = "https://bangkokflood.com,https://www.bangkokflood.com,http://localhost:3000,http://localhost:3456"
# repo ที่มี .github/workflows/ingest.yml — cron ของ Worker จะสั่ง workflow_dispatch ทุก 10 นาที (ต้องมี secret GITHUB_DISPATCH_TOKEN)
GITHUB_REPO = "kmusicman/bangkok-flood-watch"

# secrets (ห้ามใส่ในไฟล์นี้):
#   wrangler secret put INGEST_TOKEN     # สำหรับ PUT /api/ingest จาก scripts/ingest.ts หรือ GitHub Actions
#   (GISTDA_API_KEY ไม่ต้องใส่ใน Worker แล้ว — cron ไม่ดึงข้อมูลเอง; key อยู่ใน GitHub secrets)
#   wrangler secret put GITHUB_DISPATCH_TOKEN  # fine-grained PAT: repo นี้เท่านั้น, permission Actions = Read and write

[observability]
enabled = true
